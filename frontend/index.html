<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LC Performance Dashboard – AIESEC in UB</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">

    <!-- Header: LC name + data source badge -->
    <header class="header">
      <div>
        <p class="lc-name">AIESEC in Universitas Brawijaya</p>
        <h1>LC Performance Dashboard</h1>
      </div>
      <span class="badge" id="source-badge">Data: Mock (dummy)</span>
    </header>

    <!-- Filters: date range, programme toggle, actions -->
    <section class="panel filters">
      <label>
        Start date
        <input type="date" id="start-date" value="2026-01-01">
      </label>
      <label>
        End date
        <input type="date" id="end-date" value="2026-11-26">
      </label>

      <div class="toggle" role="group" aria-label="Programme">
        <button type="button" class="active" data-programme="OGX">oGX</button>
        <button type="button" data-programme="ICX">iCX</button>
      </div>

      <div class="actions">
        <button type="button" class="btn btn-primary" id="apply-btn">Apply</button>
        <button type="button" class="btn" id="export-btn">Export CSV</button>
      </div>
    </section>

    <!-- Status message: loading / empty / error. Hidden when empty text. -->
    <div class="status" id="status" hidden></div>

    <!-- Everything below is hidden while loading, on error, or when there is no data -->
    <div id="results">

    <!-- KPI cards -->
    <section class="kpis">
      <div class="kpi">
        <p class="kpi-label">Total SU</p>
        <p class="kpi-value" id="kpi-su">–</p>
      </div>
      <div class="kpi">
        <p class="kpi-label">Total APD</p>
        <p class="kpi-value" id="kpi-apd">–</p>
      </div>
      <div class="kpi">
        <p class="kpi-label">Total RE</p>
        <p class="kpi-value" id="kpi-re">–</p>
      </div>
      <div class="kpi">
        <p class="kpi-label">SU → CO</p>
        <p class="kpi-value" id="kpi-suco">–</p>
      </div>
    </section>

    <!-- Highlighted conversion rates -->
    <section class="panel highlights">
      <span>SU → APL: <strong id="conv-suapl">–</strong></span>
      <span>APL → APD: <strong id="conv-aplapd">–</strong></span>
      <span>APD → RE: <strong id="conv-apdre">–</strong></span>
    </section>

    <!-- Bar chart (drawn by Chart.js in app.js) -->
    <section class="panel">
      <h2>Count per phase</h2>
      <div class="chart-box">
        <canvas id="phase-chart"></canvas>
      </div>
    </section>

    <!-- Phase table -->
    <section class="panel">
      <h2>Funnel detail</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Phase</th>
              <th class="num">Count</th>
              <th class="num">Conversion from previous</th>
            </tr>
          </thead>
          <tbody id="phase-table">
            <!-- rows are filled by app.js -->
          </tbody>
        </table>
      </div>
    </section>

    </div> <!-- /results -->

    <footer class="footer">
      IID Technical Task · Prototype
    </footer>
  </div>

  <!-- Chart.js from CDN (only external library) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
